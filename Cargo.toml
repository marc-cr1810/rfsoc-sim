[package]
name = "rfsoc-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.35"
egui = "0.35"
egui_plot = "0.36"
egui-snarl = { version = "0.11", features = ["serde"] }
rustfft = "6"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
