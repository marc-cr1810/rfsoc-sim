[package]
name = "rfsoc-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.35"
egui = "0.35"
egui_plot = "0.36"
egui-snarl = { version = "0.11", features = ["serde"] }
rustfft = "6"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
egui-phosphor = "0.13.0"
realfft = "3.5.0"
rayon = "1.12.0"

# The capture pipeline is the whole point of the program and it runs per frame, so the
# release build is tuned for it: cross-crate inlining into rustfft/realfft, and a single
# codegen unit so the per-sample loops are not split across compilation boundaries.
[profile.release]
lto = "fat"
codegen-units = 1
